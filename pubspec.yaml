name: battle_cows
description: "Battle Cows - A hex-based territory strategy game"
publish_to: 'https://flutter.dev'
version: 1.0.1+5

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  google_fonts: ^6.2.1
  flame: ^1.36.0
  flame_audio: ^2.12.0
  google_mobile_ads: ^5.3.1
  vector_math: ^2.1.4
  shared_preferences: ^2.2.2
  icony: ^1.0.5
  share_plus: ^10.1.4
  in_app_review: ^2.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/Background/
    - assets/images/Board Tiles/
    - assets/images/Cows/
    - assets/images/Effects/
    - assets/images/Tile Image/
    - assets/images/ui/
    - assets/sounds/
    - assets/audio/
    - assets/models/
