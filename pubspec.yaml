name: battle_cows
description: "Battle Cows - A hex-based territory strategy game"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  google_fonts: ^6.2.1
  flame: ^1.36.0
  flame_audio: ^2.12.0
  google_mobile_ads: ^5.3.1
  vector_math: ^2.1.4
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/Background/
    - assets/images/Tile Image/
    - assets/sounds/
    - assets/models/
